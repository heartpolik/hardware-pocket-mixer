; Teensy 4.1 build. src/core is shared with the simulator (Makefile); src/teensy is the platform layer.
; pio run            -> stock Teensy core: 44.1 kHz, USB audio stereo (MAIN or one input) + MIDI + Serial
; pio run -e uac2    -> 48 kHz, USB Audio Class 2, 8 channels each way + MIDI + Serial: UAC2 core files
;                       of https://github.com/grrrr/teensy-4-usbAudio (MIT, fork of alex6679) over a local
;                       copy of the framework - run `sh tools/setup_uac2.sh` first (docs/06-firmware.md)
[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<core/> +<teensy/>
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -D USB_MIDI_AUDIO_SERIAL -O2
upload_protocol = teensy-gui

[env:teensy41]

[env:uac2]
; sh tools/setup_uac2.sh first: framework copy with the UAC2 core files (tools/ext, not in git)
platform_packages = framework-arduinoteensy@symlink://tools/ext/framework-teensy-uac2
build_flags = ${env.build_flags} -D MIXER_USB_OCT
    -D AUDIO_SAMPLE_RATE_EXACT=48000.0f -D AUDIO_SAMPLE_RATE_I=48000
    -D AUDIO_USB_CHANNEL_COUNT=8 -D AUDIO_USB_FORMAT=1 -D AUDIO_SUBSLOT_SIZE=2
