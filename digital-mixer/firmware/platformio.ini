; Teensy 4.1 build. src/core is shared with the simulator (Makefile); src/teensy is the platform layer.
; pio run            -> stock Teensy core: 44.1 kHz, USB audio stereo (MAIN or one input) + MIDI + Serial
; pio run -e uac2    -> 48 kHz, 8 USB channels to the DAW: needs the UAC2 core files from
;                       https://github.com/grrrr/teensy-4-usbAudio (fork of alex6679) copied into the
;                       framework (see docs/06-firmware.md) - not built or checked here
[platformio]
default_envs = teensy41

[env]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<core/> +<teensy/>
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -D USB_MIDI_AUDIO_SERIAL -O2
upload_protocol = teensy-gui

[env:teensy41]

[env:uac2]
build_flags = ${env.build_flags} -D AUDIO_SAMPLE_RATE_EXACT=48000.0f -D MIXER_USB_OCT
